services:
  backend:
    build: .
    env_file:
      - ./env.backend
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    depends_on:
      - parser
      - ml-service
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "worker.js"]
    env_file:
      - ./env.worker
    volumes:
      - ./uploads:/usr/src/app/uploads
    depends_on:
      - backend
      - parser
      - ml-service
    restart: on-failure

  parser:
    build: ./parser
    env_file:
      - ./env.parser
    ports:
      - "7000:7000"
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    env_file:
      - ./env.ml
    ports:
      - "8000:8000"
    restart: unless-stopped
